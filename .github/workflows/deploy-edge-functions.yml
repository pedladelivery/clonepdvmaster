name: Deploy Edge Functions - PDV Salão Universal

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Project Ref do Supabase da loja de destino"
        required: true
        type: string

      confirm_project_ref:
        description: "Digite novamente o Project Ref para confirmar"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-supabase-${{ inputs.project_ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar sete funções no Supabase selecionado
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validar projeto de destino
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
          CONFIRM_REF: ${{ inputs.confirm_project_ref }}
        run: |
          set -e

          if [[ ! "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "ERRO: Project Ref inválido."
            exit 1
          fi

          if [ "$PROJECT_REF" != "$CONFIRM_REF" ]; then
            echo "ERRO: A confirmação do projeto não corresponde."
            exit 1
          fi

          echo "Projeto de destino confirmado."
          echo "Project Ref: $PROJECT_REF"

      - name: Verificar token de acesso
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ERRO: Token Supabase não configurado."
            exit 1
          fi

          echo "Token de acesso encontrado."

      - name: Publicar as sete Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.project_ref }}
        run: |
          set -e

          FUNCTIONS=(
            admin-update-user
            create-admin-user
            factory-reset
            master-admin
            master-auth
            master-sync
            pdv-subscription
          )

          for FUNCTION in "${FUNCTIONS[@]}"; do

            echo "=================================="
            echo "Publicando: $FUNCTION"
            echo "Destino: $PROJECT_REF"
            echo "=================================="

            supabase functions deploy "$FUNCTION" \
              --project-ref "$PROJECT_REF" \
              --yes

            echo "SUCESSO: $FUNCTION publicada."

          done

          echo "=================================="
          echo "AS SETE FUNÇÕES FORAM PUBLICADAS."
          echo "Projeto: $PROJECT_REF"
          echo "=================================="
